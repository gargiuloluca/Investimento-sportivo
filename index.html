<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Statistico Sportivo - Singole ad Alta Probabilità</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0f19;
            --surface: #131b2e;
            --surface-hover: #1a253e;
            --border: #232f48;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-green: #10b981;
            --accent-green-bg: rgba(16, 185, 129, 0.12);
            --accent-blue: #38bdf8;
            --accent-yellow: #f59e0b;
            --accent-purple: #a855f7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding: 24px 16px;
            line-height: 1.5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
            gap: 16px;
        }

        .title-box h1 {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .title-box p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 4px;
        }

        .meta-badge {
            background-color: var(--surface);
            border: 1px solid var(--border);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            color: var(--accent-blue);
            font-weight: 600;
        }

        /* Controls / Filter Bar */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
            background-color: var(--surface);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .control-group {
            flex: 1;
            min-width: 200px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            background: #0b0f19;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--accent-blue);
        }

        /* Match Cards */
        .cards-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        .match-card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            transition: transform 0.15s, border-color 0.15s;
        }

        .match-card:hover {
            border-color: #3b82f6;
            background-color: var(--surface-hover);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .league-tag {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .best-pick-banner {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--accent-green-bg);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34d399;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .match-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 16px;
            color: #ffffff;
        }

        /* Odds & Stats Grid */
        .markets-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 8px;
            margin-top: 12px;
        }

        .market-box {
            background: #0b0f19;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            transition: all 0.15s;
        }

        .market-box.top-choice {
            border: 1.5px solid var(--accent-green);
            background: rgba(16, 185, 129, 0.08);
        }

        .market-label {
            font-size: 0.72rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
        }

        .market-prob {
            font-size: 1.05rem;
            font-weight: 800;
            margin-top: 4px;
            color: var(--text-main);
        }

        .market-box.top-choice .market-prob {
            color: #10b981;
        }

        .stats-footer {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px dashed var(--border);
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .stats-item strong {
            color: #e2e8f0;
        }

        /* Loading / Empty States */
        .status-msg {
            text-align: center;
            padding: 40px;
            font-size: 1.1rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="title-box">
                <h1>Filtro Singole ad Alta Probabilità</h1>
                <p>Scanner probabilistico su 1X2, Doppia Chance, Under/Over 2.5, Corner e Cartellini</p>
            </div>
            <div class="meta-badge" id="update-badge">Caricamento quote e modelli...</div>
        </header>

        <!-- Filtri Rapidi -->
        <div class="controls">
            <div class="control-group">
                <label for="search">Cerca Squadra</label>
                <input type="text" id="search" placeholder="Es. Napoli, Inter, Arsenal..." oninput="filterMatches()">
            </div>
            <div class="control-group">
                <label for="league-filter">Campionato</label>
                <select id="league-filter" onchange="filterMatches()">
                    <option value="ALL">Tutti i Campionati</option>
                </select>
            </div>
            <div class="control-group">
                <label for="min-prob">Probabilità Minima Singola</label>
                <select id="min-prob" onchange="filterMatches()">
                    <option value="75">75% (Minimo di sicurezza)</option>
                    <option value="80" selected>80% (Alta probabilità)</option>
                    <option value="85">85% (Altissima probabilità)</option>
                </select>
            </div>
        </div>

        <!-- Risultati -->
        <div id="cards-container" class="cards-grid">
            <div class="status-msg">Analisi e caricamento delle migliori singole in corso...</div>
        </div>
    </div>

    <script>
        let allMatches = [];

        async function loadData() {
            try {
                const res = await fetch('data/predictions.json');
                const data = await res.json();

                document.getElementById('update-badge').innerText = `Aggiornato: ${data.last_update}`;
                allMatches = data.matches;

                // Popola filtro campionati
                const leagues = [...new Set(allMatches.map(m => m.league))];
                const leagueSelect = document.getElementById('league-filter');
                leagues.forEach(l => {
                    const opt = document.createElement('option');
                    opt.value = l;
                    opt.textContent = l;
                    leagueSelect.appendChild(opt);
                });

                filterMatches();
            } catch (err) {
                document.getElementById('cards-container').innerHTML = 
                    '<div class="status-msg">Nessun dato ancora caricato. Esegui la prima GitHub Action dal tuo repository!</div>';
            }
        }

        function filterMatches() {
            const query = document.getElementById('search').value.toLowerCase();
            const selectedLeague = document.getElementById('league-filter').value;
            const minProb = parseFloat(document.getElementById('min-prob').value);

            const filtered = allMatches.filter(m => {
                const matchName = m.match.toLowerCase();
                const matchesQuery = matchName.includes(query);
                const matchesLeague = (selectedLeague === "ALL" || m.league === selectedLeague);
                const matchesProb = m.top_bet.probability >= minProb;
                return matchesQuery && matchesLeague && matchesProb;
            });

            render(filtered);
        }

        function render(matches) {
            const container = document.getElementById('cards-container');
            if (matches.length === 0) {
                container.innerHTML = '<div class="status-msg">Nessuna partita soddisfa i criteri di probabilità impostati.</div>';
                return;
            }

            container.innerHTML = matches.map(m => {
                const topMarket = m.top_bet.market;
                const mk = m.all_markets;

                // Mercati principali da mostrare in griglia
                const marketKeys = [
                    "1", "X", "2", 
                    "1X", "X2", "12", 
                    "Under 2.5", "Over 2.5", 
                    "Corner Over 8.5", "Corner Under 11.5", 
                    "Cartellini Over 3.5", "Cartellini Under 5.5"
                ];

                const boxesHtml = marketKeys.map(key => {
                    const isTop = (key === topMarket);
                    return `
                        <div class="market-box ${isTop ? 'top-choice' : ''}">
                            <div class="market-label">${key}</div>
                            <div class="market-prob">${mk[key] || '-'}%</div>
                        </div>
                    `;
                }).join('');

                return `
                    <div class="match-card">
                        <div class="card-header">
                            <span class="league-tag">${m.league}</span>
                            <div class="best-pick-banner">
                                ⭐ Singola Migliore: <strong>${m.top_bet.market} (${m.top_bet.probability}%)</strong>
                            </div>
                        </div>
                        <div class="match-title">${m.match}</div>

                        <!-- Tutte le giocate a confronto -->
                        <div class="markets-container">
                            ${boxesHtml}
                        </div>

                        <!-- Statistiche di supporto -->
                        <div class="stats-footer">
                            <span class="stats-item">Stima Gol: <strong>${m.exp_goals}</strong></span>
                            <span class="stats-item">Media Corner Partita: <strong>${m.exp_corners}</strong></span>
                            <span class="stats-item">Media Cartellini Partita: <strong>${m.exp_cards}</strong></span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        loadData();
    </script>
</body>
</html>
