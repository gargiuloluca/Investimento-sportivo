<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investimento Sportivo - Singole e Multipla Quota 2.50</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0f19;
            --surface: #131b2e;
            --border: #232f48;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-green: #10b981;
            --accent-yellow: #f59e0b;
            --accent-blue: #38bdf8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text-main); padding: 20px 14px; }
        .container { max-width: 1100px; margin: 0 auto; }
        header { border-bottom: 1px solid var(--border); padding-bottom: 16px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        h1 { font-size: 1.5rem; color: var(--accent-blue); }
        .update-badge { font-size: 0.85rem; color: var(--text-muted); background: var(--surface); padding: 6px 12px; border-radius: 6px; }

        /* Box Multipla Consigliata */
        .multipla-box {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.12), rgba(16, 185, 129, 0.08));
            border: 1.5px solid var(--accent-yellow);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
        }
        .multi-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .multi-title { font-weight: 800; font-size: 1.1rem; color: var(--accent-yellow); }
        .multi-odds { font-size: 1.25rem; font-weight: 800; color: #ffffff; background: #b45309; padding: 4px 10px; border-radius: 6px; }
        .multi-legs { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
        .leg-card { background: var(--surface); padding: 10px; border-radius: 8px; border: 1px solid var(--border); }
        .leg-match { font-size: 0.85rem; font-weight: 600; }
        .leg-pick { font-size: 0.95rem; font-weight: 700; color: var(--accent-green); margin-top: 4px; }

        /* Griglia Match */
        .match-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
        .league { font-size: 0.8rem; color: var(--accent-blue); font-weight: 600; }
        .single-pick { background: rgba(16, 185, 129, 0.15); border: 1px solid var(--accent-green); color: #34d399; padding: 4px 10px; border-radius: 16px; font-size: 0.85rem; font-weight: 700; }
        .match-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 12px; }

        .markets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
        .market-item { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px; text-align: center; }
        .market-item.top-single { border-color: var(--accent-green); background: rgba(16, 185, 129, 0.08); }
        .m-name { font-size: 0.7rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
        .m-prob { font-size: 0.95rem; font-weight: 800; color: #fff; margin-top: 2px; }
        .m-odds { font-size: 0.8rem; color: var(--accent-yellow); font-weight: 700; }
        .stats-bar { font-size: 0.8rem; color: var(--text-muted); margin-top: 12px; border-top: 1px dashed var(--border); padding-top: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>Scanner Singole (Quota &ge; 1.50) & Multipla Max 2.50</h1>
            </div>
            <div class="update-badge" id="update-time">Caricamento...</div>
        </header>

        <!-- Multipla del Giorno -->
        <div id="multipla-container"></div>

        <!-- Elenco Partite Singole -->
        <h2 style="font-size:1.15rem; margin-bottom:14px; color:#e2e8f0;">Singole Filtrate (Quota Minima 1.50)</h2>
        <div id="matches-list"></div>
    </div>

    <script>
        fetch('data/predictions.json')
            .then(res => res.json())
            .then(data => {
                document.getElementById('update-time').innerText = "Aggiornato: " + data.last_update;

                // 1. Render Multipla
                const multi = data.multipla_consigliata;
                if (multi && multi.legs.length > 0) {
                    let legsHtml = multi.legs.map(l => `
                        <div class="leg-card">
                            <div class="leg-match">${l.match}</div>
                            <div class="leg-pick">${l.market} @ ${l.odds} <span style="font-size:0.75rem; color:#94a3b8;">(${l.prob}%)</span></div>
                        </div>
                    `).join('');

                    document.getElementById('multipla-container').innerHTML = `
                        <div class="multipla-box">
                            <div class="multi-header">
                                <div class="multi-title">🎯 Multipla del Giorno (Max 4 Eventi - Quota &ge; 1.30 per evento)</div>
                                <div class="multi-odds">Quota Totale: ${multi.total_odds}</div>
                            </div>
                            <div class="multi-legs">${legsHtml}</div>
                        </div>
                    `;
                }

                // 2. Render Singole
                const list = document.getElementById('matches-list');
                list.innerHTML = data.matches.map(m => {
                    const top = m.top_single;
                    const boxes = Object.keys(m.all_markets).map(k => {
                        const item = m.all_markets[k];
                        const isTop = top && (top.market === k);
                        return `
                            <div class="market-item ${isTop ? 'top-single' : ''}">
                                <div class="m-name">${k}</div>
                                <div class="m-prob">${item.prob}%</div>
                                <div class="m-odds">@${item.odds}</div>
                            </div>
                        `;
                    }).join('');

                    return `
                        <div class="match-card">
                            <div class="card-header">
                                <span class="league">${m.league}</span>
                                ${top ? `<span class="single-pick">⭐ Singola Consigliata: <strong>${top.market}</strong> @ ${top.odds} (${top.prob}%)</span>` : '<span style="font-size:0.8rem; color:#94a3b8;">Nessuna singola soddisfa quota &ge; 1.50</span>'}
                            </div>
                            <div class="match-title">${m.match}</div>
                            <div class="markets-grid">${boxes}</div>
                            <div class="stats-bar">Stima Gol: <strong>${m.exp_goals}</strong> | Media Angoli: <strong>${m.exp_corners}</strong></div>
                        </div>
                    `;
                }).join('');
            });
    </script>
</body>
</html>
